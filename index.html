<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MVS NGO Manager</title>
  <!-- Tailwind CSS (स्टाइलिंग के लिए) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 font-sans">

  <!-- Supabase Configuration (यहाँ अपनी डिटेल्स डालें) -->
  <script>
    const SUPABASE_URL = "https://jwlxospcgbkpizmdbdxh.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3bHhvc3BjZ2JrcGl6bWRiZHhoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzgxNjQxNSwiZXhwIjoyMTA5MzkyNDE1fQ.TJ4HySVvlTYrbhyhsUNcwK1AxSat3StFy6l-VrdJgpo";
    
    // Supabase क्लाइंट शुरू करना
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE") {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  </script>

  <!-- 1. Header (शीर्ष पट्टी) -->
  <header class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold tracking-tight">MVS NGO Manager</h1>
        <p class="text-xs text-blue-100" id="ngo-subtitle">मानव विकास संस्थान</p>
      </div>
      <!-- भाषा बदलने का बटन -->
      <button onclick="toggleLanguage()" class="bg-blue-800 border border-blue-400 text-xs px-2.5 py-1.5 rounded-full font-medium flex items-center gap-1 active:bg-blue-900">
        🌐 <span id="lang-btn-text">English</span>
      </button>
    </div>
  </header>

  <!-- मुख्य कंटेनर -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- 2. क्विक सारांश कार्ड्स (Dashboard Metrics) -->
    <section>
      <div class="flex justify-between items-center mb-2.5">
        <h2 class="text-sm font-semibold text-slate-600 uppercase tracking-wider" data-hi="संक्षिप्त स्थिति" data-en="Overview">संक्षिप्त स्थिति</h2>
        <span class="text-xs bg-green-100 text-green-700 font-medium px-2 py-0.5 rounded-full" id="db-status">● Live</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- कुल दान -->
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" data-hi="कुल दान (प्राप्त)" data-en="Total Donations">कुल दान (प्राप्त)</p>
          <p class="text-xl font-bold text-blue-700 mt-1" id="stat-donations">₹0</p>
        </div>
        <!-- सक्रिय प्रोजेक्ट्स -->
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" data-hi="चालू प्रोजेक्ट्स" data-en="Active Projects">चालू प्रोजेक्ट्स</p>
          <p class="text-xl font-bold text-slate-800 mt-1" id="stat-projects">0</p>
        </div>
        <!-- कुल लाभार्थी -->
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" data-hi="कुल लाभार्थी" data-en="Beneficiaries">कुल लाभार्थी</p>
          <p class="text-xl font-bold text-emerald-600 mt-1" id="stat-beneficiaries">0</p>
        </div>
        <!-- कुल खर्च -->
        <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs text-slate-500 font-medium" data-hi="कुल खर्च" data-en="Total Expenses">कुल खर्च</p>
          <p class="text-xl font-bold text-rose-600 mt-1" id="stat-expenses">₹0</p>
        </div>
      </div>
    </section>

    <!-- 3. क्विक एक्शन बटन (Quick Actions) -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2.5">
      <h3 class="text-xs font-semibold text-slate-500 uppercase" data-hi="त्वरित कार्य" data-en="Quick Actions">त्वरित कार्य</h3>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <button onclick="alert('दान एंट्री फॉर्म अगले चरण में सक्रिय होगा!')" class="w-full bg-blue-50 text-blue-700 border border-blue-200 py-2.5 px-3 rounded-lg font-medium text-center active:bg-blue-100">
          + <span data-hi="नया दान जोड़ें" data-en="New Donation">नया दान जोड़ें</span>
        </button>
        <button onclick="alert('लाभार्थी फॉर्म अगले चरण में सक्रिय होगा!')" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2.5 px-3 rounded-lg font-medium text-center active:bg-emerald-100">
          + <span data-hi="नया लाभार्थी" data-en="New Beneficiary">नया लाभार्थी</span>
        </button>
      </div>
    </section>

    <!-- 4. एक्टिव प्रोजेक्ट्स सूची (Database Preview) -->
    <section>
      <div class="flex justify-between items-center mb-2.5">
        <h2 class="text-sm font-semibold text-slate-600 uppercase tracking-wider" data-hi="संस्था के प्रोजेक्ट्स" data-en="NGO Projects">संस्था के प्रोजेक्ट्स</h2>
        <button onclick="loadDashboardData()" class="text-xs text-blue-600 underline font-medium" data-hi="रिफ्रेश" data-en="Refresh">रिफ्रेश</button>
      </div>

      <div id="projects-list" class="space-y-2">
        <div class="bg-white p-4 rounded-xl border border-slate-200 text-center text-slate-400 text-xs py-6">
          डेटा लोड हो रहा है...
        </div>
      </div>
    </section>

  </main>

  <!-- 5. मोबाइल बॉटम नेविगेशन (Bottom Nav) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 z-40 shadow-lg">
    <div class="max-w-md mx-auto px-4 flex justify-around text-center text-xs">
      <button class="text-blue-700 font-semibold flex flex-col items-center">
        <span class="text-lg">🏠</span>
        <span data-hi="होम" data-en="Home">होम</span>
      </button>
      <button onclick="alert('यह सेक्शन अगले चरण में खुलेगा')" class="text-slate-500 flex flex-col items-center">
        <span class="text-lg">💰</span>
        <span data-hi="दान" data-en="Donations">दान</span>
      </button>
      <button onclick="alert('यह सेक्शन अगले चरण में खुलेगा')" class="text-slate-500 flex flex-col items-center">
        <span class="text-lg">👥</span>
        <span data-hi="लाभार्थी" data-en="Beneficiaries">लाभार्थी</span>
      </button>
      <button onclick="alert('यह सेक्शन अगले चरण में खुलेगा')" class="text-slate-500 flex flex-col items-center">
        <span class="text-lg">📊</span>
        <span data-hi="रिपोर्ट्स" data-en="Reports">रिपोर्ट्स</span>
      </button>
    </div>
  </nav>

  <!-- लॉजिक और डेटा लोड करने की स्क्रिप्ट -->
  <script>
    let currentLang = 'hi';

    // भाषा बदलने का फंक्शन
    function toggleLanguage() {
      currentLang = currentLang === 'hi' ? 'en' : 'hi';
      document.getElementById('lang-btn-text').innerText = currentLang === 'hi' ? 'English' : 'हिंदी';
      document.getElementById('ngo-subtitle').innerText = currentLang === 'hi' ? 'मानव विकास संस्थान' : 'Manav Vikas Sansthan';
      
      document.querySelectorAll('[data-hi]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });
    }

    // Supabase से डेटा लोड करना
    async function loadDashboardData() {
      if (!supabaseClient) {
        document.getElementById('db-status').innerText = 'Offline (Keys Missing)';
        document.getElementById('db-status').className = 'text-xs bg-amber-100 text-amber-700 font-medium px-2 py-0.5 rounded-full';
        document.getElementById('projects-list').innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg text-xs">
            कृपया index.html फ़ाइल में अपनी Supabase URL और Anon Key अपडेट करें।
          </div>`;
        return;
      }

      try {
        // 1. प्रोजेक्ट्स फेच करें
        const { data: projects, error: projError } = await supabaseClient
          .from('projects')
          .select('*')
          .order('created_at', { ascending: false });

        if (projError) throw projError;

        document.getElementById('stat-projects').innerText = projects ? projects.length : 0;

        // प्रोजेक्ट्स स्क्रीन पर दिखाना
        const listContainer = document.getElementById('projects-list');
        if (!projects || projects.length === 0) {
          listContainer.innerHTML = '<div class="bg-white p-4 rounded-xl border text-center text-xs text-slate-500">कोई प्रोजेक्ट नहीं मिला।</div>';
        } else {
          listContainer.innerHTML = projects.map(p => `
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
              <div>
                <h4 class="font-semibold text-sm text-slate-800">${p.project_name}</h4>
                <p class="text-xs text-slate-500 mt-0.5">📂 ${p.category}</p>
              </div>
              <span class="text-xs px-2 py-1 rounded-full font-medium ${p.status === 'Active' ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-600'}">
                ${p.status}
              </span>
            </div>
          `).join('');
        }

        // 2. लाभार्थी संख्या
        const { count: benCount } = await supabaseClient
          .from('beneficiaries')
          .select('*', { count: 'exact', head: true });
        document.getElementById('stat-beneficiaries').innerText = benCount || 0;

        // 3. डोनेशन जोड़
        const { data: donations } = await supabaseClient.from('donations').select('amount');
        const totalDonation = (donations || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        document.getElementById('stat-donations').innerText = `₹${totalDonation.toLocaleString('en-IN')}`;

        // 4. कुल खर्च
        const { data: expenses } = await supabaseClient.from('expenses').select('amount');
        const totalExp = (expenses || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        document.getElementById('stat-expenses').innerText = `₹${totalExp.toLocaleString('en-IN')}`;

        document.getElementById('db-status').innerText = '● Connected';
        document.getElementById('db-status').className = 'text-xs bg-green-100 text-green-700 font-medium px-2 py-0.5 rounded-full';

      } catch (err) {
        console.error('Error fetching data:', err);
        document.getElementById('projects-list').innerHTML = `
          <div class="bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-lg text-xs">
            डेटा लोड करने में समस्या आई: ${err.message}
          </div>`;
      }
    }

    // पेज लोड होने पर डेटा लाएं
    window.addEventListener('DOMContentLoaded', loadDashboardData);
  </script>
</body>
</html>
